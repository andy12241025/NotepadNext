name: Build Notepad Next

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

env:
  QT_RELEASE_VER: 6.5

jobs:
  windows:
    name: Windows zip (MSVC, Qt 6.5)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_RELEASE_VER }}
          modules: 'qt5compat'
          cache: true

      - name: Setup Visual Studio Tools
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Package
        run: cmake --build build --target package --parallel

      - name: Upload Windows zip Package
        uses: actions/upload-artifact@v7
        with:
          name: NotepadNext-Windows-Qt${{ env.QT_RELEASE_VER }}-Zip
          path: ${{ github.workspace }}/build/package/

  linux-deb:
    name: Linux deb (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Built against the distribution's Qt so the package depends on the distribution's Qt libraries
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ dpkg-dev \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libqt6core5compat6-dev libgl-dev libxkbcommon-dev

      - name: Configure
        run: QMAKE=$(which qmake6) cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cd build && cpack -G DEB

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: NotepadNext-Linux-deb
          path: ${{ github.workspace }}/build/notepadnext_*.deb

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [windows, linux-deb]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create the release if it does not exist
        run: |
          gh release view ${{ github.ref_name }} > /dev/null 2>&1 \
            || gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes

      - name: Upload Windows Zip
        run: |
          cd NotepadNext-Windows-Qt$QT_RELEASE_VER-Zip/
          zip -r ../NotepadNext-${{ github.ref_name }}-win64.zip .
          cd ..
          gh release upload ${{ github.ref_name }} NotepadNext-${{ github.ref_name }}-win64.zip --clobber

      - name: Upload deb
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-Linux-deb/notepadnext_*.deb --clobber
